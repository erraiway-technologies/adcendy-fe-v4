name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing the release image on main; read-only elsewhere.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify pinned Node and npm
        run: npm run toolchain:check

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high

      - name: Verify pinned Backend contract
        run: npm run gen:api:check

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate UAT runtime fixture
        run: npm run env:check
        env:
          APP_ENV: uat
          APP_ORIGIN: https://uat.adcendy.com
          RELEASE_ID: ${{ github.sha }}
          SUPPORT_URL: https://uat.adcendy.com/contact

      - name: Validate Production runtime fixture
        run: npm run env:check
        env:
          APP_ENV: production
          APP_ORIGIN: https://www.adcendy.com
          RELEASE_ID: ${{ github.sha }}
          SUPPORT_URL: https://www.adcendy.com/contact

      - name: Build immutable application
        run: npm run build

      - name: Install Chromium for browser integration tests
        run: npx playwright install --with-deps chromium

      - name: Browser integration tests against the Production build
        run: npm run test:e2e
        env:
          E2E_PRODUCTION: "true"

      - name: Scan browser bundle
        run: npm run bundle:scan

      - name: Build standalone container once
        run: docker build --build-arg NODE_VERSION="$(cat .nvmrc)" --tag adcendy-fe:${{ github.sha }} .

      - name: Generate Production dependency SBOM
        run: |
          mkdir -p release
          npm run --silent sbom:generate > release/frontend-sbom.cdx.json

      - name: Validate the same image with UAT configuration
        run: >-
          docker run --rm
          -e APP_ENV=uat
          -e APP_ORIGIN=https://uat.adcendy.com
          -e RELEASE_ID=${{ github.sha }}
          -e SUPPORT_URL=https://uat.adcendy.com/contact
          adcendy-fe:${{ github.sha }}
          node --experimental-strip-types scripts/validate-runtime-config.ts

      - name: Validate the same image with Production configuration
        run: >-
          docker run --rm
          -e APP_ENV=production
          -e APP_ORIGIN=https://www.adcendy.com
          -e RELEASE_ID=${{ github.sha }}
          -e SUPPORT_URL=https://www.adcendy.com/contact
          adcendy-fe:${{ github.sha }}
          node --experimental-strip-types scripts/validate-runtime-config.ts

      - name: Record local image content identifier
        run: |
          mkdir -p release
          docker image inspect adcendy-fe:${{ github.sha }} --format='{"imageId":"{{.Id}}"}' > release/image-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release-${{ github.sha }}
          path: |
            release/image-manifest.json
            release/frontend-sbom.cdx.json
            config/deployment/backend-contract.json
            config/deployment/files-contract.json
            config/deployment/frontend-proxy-contract.v1.json
          retention-days: 30

      # A release is an image digest, not a branch name. Only main publishes,
      # and only after every check above has passed, so a digest that exists is
      # a digest that was verified. It is the image validated above, pushed as
      # is; deploys name its digest and nothing on the server ever builds.
      - name: Publish the release image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REGISTRY: ghcr.io
          OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR rejects uppercase paths, and the owner is Erraiway-Technologies.
          image="$REGISTRY/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/adcendy-fe"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker tag adcendy-fe:${{ github.sha }} "$image:sha-${{ github.sha }}"
          docker push "$image:sha-${{ github.sha }}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:sha-${{ github.sha }}")"
          echo "Released: $digest"
          {
            echo "## Release image"
            echo
            echo "Deploy this digest, and nothing else:"
            echo
            echo '```'
            echo "FRONTEND_IMAGE=$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
